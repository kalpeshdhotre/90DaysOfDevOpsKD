apiVersion: v1
kind: Pod
metadata:
  name: live-config-pod
spec:
  containers:
    - name: busybox
      image: busybox
      command:
        [
          "sh",
          "-c",
          "while true; do cat /etc/live-config/message; echo; sleep 5; done",
        ]
      volumeMounts:
        - name: live-volume
          mountPath: /etc/live-config
  volumes:
    - name: live-volume
      configMap:
        name: live-config
